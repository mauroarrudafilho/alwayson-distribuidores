[build]
builder = "DOCKERFILE"
dockerfilePath = "services/pdv-pipeline/Dockerfile"

[deploy]
# TEMP: carga única da Receita no volume — reverter para server.mjs depois de "Pronto:" nos logs
startCommand = "node scripts/download-receita-estabelecimentos.mjs --snapshot 2025-07-30"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
